
<!DOCTYPE html>
<html>
<head>
    <title>Hospital Appointment Booking</title>
</head>
<body>

    <h1>Hospital Appointment Booking</h1>
    <p>Book Your Doctor Appointment Online</p>

    <form>

        <h2>Patient Details</h2>

        <label>Patient Name:</label>
        <input type="text" placeholder="Enter patient name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter email">
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" placeholder="Enter phone number" required>
        <br><br>

        <label>Age:</label>
        <input type="number" min="1" max="120">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
        <br><br>

        <h2>Appointment Details</h2>

        <label>Department:</label>
       
        <br><br>

        <label>Select Doctor:</label>
       
        <br><br>

        <label>Appointment Date:</label>
        <input type="date">
        <br><br>

        <label>Appointment Time:</label>
        <input type="time">
        <br><br>

        <h2>Medical Information</h2>

        <label>Symptoms:</label>
        <br>
        <textarea rows="4" cols="40" placeholder="Describe your symptoms"></textarea>
        <br><br>

        <label>Medical History:</label>
        <br>
        <textarea rows="4" cols="40" placeholder="Enter your medical history"></textarea>
        <br><br>

        <input type="submit" value="Book Appointment">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
